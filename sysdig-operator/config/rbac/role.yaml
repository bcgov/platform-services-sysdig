---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ops.gov.bc.ca
  resources:
  - sysdig-teams
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ops.gov.bc.ca
  resources:
  - sysdig-teams/finalizers
  verbs:
  - update
- apiGroups:
  - ops.gov.bc.ca
  resources:
  - sysdig-teams/status
  verbs:
  - get
  - patch
  - update
